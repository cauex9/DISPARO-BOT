{% extends 'layout.html' %}
{% block content %}
<div class="columns" style="justify-content: center; align-items: center; min-height: 70vh;">
  <section class="panel" style="max-width: 400px; width: 100%;">
    <div class="panel-head">
      <div><p class="eyebrow">Segurança</p><h2>Login</h2></div>
    </div>
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Usuário ou e-mail
        <input type="text" name="identifier" required autofocus>
      </label>
      <label>Senha
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="button primary full">Entrar</button>
    </form>
    <p class="auth-link">Não tem uma conta? <a href="{{ url_for('register') }}">Criar conta</a></p>
  </section>
</div>
{% endblock %}
